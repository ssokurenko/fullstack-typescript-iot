services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
      - "4001:4001"

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "8080:80"
    depends_on:
      - server

  mock-device:
    build:
      context: .
      dockerfile: apps/mock-device/Dockerfile
    environment:
      MOCK_TARGET_URL: http://server:4000/readings
    depends_on:
      - server
